<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>EDHオタクカード一覧</title>
  <style>
    body { margin:16px; font-family: system-ui, -apple-system, "Segoe UI", Arial, "Noto Sans JP", sans-serif; }
    .toolbar {
      display:grid; grid-template-columns: 1fr 190px auto auto auto auto;
      gap:8px; align-items:center; margin-bottom:12px;
    }
    .toolbar input, .toolbar select, .toolbar label { padding:8px; font-size:14px; }
    .colors { display:flex; gap:10px; align-items:center; flex-wrap: wrap; }
    .colors label { display:inline-flex; align-items:center; gap:4px; font-size:14px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap:12px; }
    .card { display:flex; flex-direction:column; gap:6px; }
    .thumb { width:100%; height:auto; border-radius:10px; background:#f3f4f6; }
    .cap { font-size:12px; color:#374151; line-height:1.3; }
    .meta { font-size:12px; color:#6b7280; }
  </style>
</head>
<body>
  <h1 style="margin:0 0 8px;">EDHオタクカード一覧</h1>

  <div class="toolbar">
    <!-- 検索：カード名（含む） -->
    <input id="q" type="search" placeholder="カード名で検索（含む）">

    <!-- プレゼンター絞り込み -->
    <select id="presenter">
      <option value="">プレゼンター（すべて）</option>
      <option>トロピ大塚</option>
      <option>いってつ</option>
      <option>スギちゃん</option>
      <option>タイシン</option>
      <option>タカノシゲキ</option>
      <option>ソラノ</option>
      <option>ブチャラティ</option>
      <option>卍幻日輪廻卍のタイシン</option>
      <option>その他</option>
    </select>

    <!-- Commander基準の色チェック（Color Identityのみ使用） -->
    <div class="colors" id="colorBox" aria-label="色で絞り込み（Color Identity）">
      <label><input type="checkbox" value="W">白</label>
      <label><input type="checkbox" value="U">青</label>
      <label><input type="checkbox" value="B">黒</label>
      <label><input type="checkbox" value="R">赤</label>
      <label><input type="checkbox" value="G">緑</label>
      <label><input type="checkbox" value="C">無</label>
    </div>

    <!-- ソート -->
    <select id="sortKey">
      <option value="none">ソートなし</option>
      <option value="color">色（Identity）</option>
      <option value="episode">話数</option>
    </select>
    <select id="sortDir">
      <option value="asc">昇順</option>
      <option value="desc">降順</option>
    </select>
  </div>

  <div class="meta" id="stat" style="margin-bottom:8px;">loading…</div>
  <div id="grid" class="grid">loading…</div>

  <script>
    // ===== 列名（必要なら調整）=====
    const KEY_IMG       = '画像URL';
    const KEY_JA        = 'カード名 (日本語)';
    const KEY_EN        = 'カード名 (英語)';
    const KEY_PRES      = 'プレゼンター';
    const KEY_COLOR_ID  = 'Color Identity'; // Commander基準はこれだけ使う
    const KEY_EPISODE   = '話数';

    // 主要プレゼンター（その他判定に使用）
    const MAIN_PRESENTERS = new Set(['トロピ大塚','いってつ','スギちゃん','タイシン','タカノシゲキ','ソラノ','ブチャラティ','卍幻日輪廻卍のタイシン']);

    // ===== 状態 =====
    const ALL = [];
    let view = [];
    const grid = document.getElementById('grid');
    const stat = document.getElementById('stat');

    // ===== util =====
    const toHttps = (u) => (typeof u === 'string' ? u.replace(/^http:\/\//i,'https://') : '');
    const s = (v) => String(v ?? '').trim();

    function getTitle(row) { return s(row[KEY_JA]) || s(row[KEY_EN]) || 'カード'; }
    function getPresenterRaw(row) { return s(row[KEY_PRES]); }
    function getPresenterBucket(row) {
      const raw = getPresenterRaw(row);
      if (!raw) return '';
      const parts = raw.split(/[,\u3001\/／・\s]+/).map(x => x.trim()).filter(Boolean);
      for (const p of parts) if (MAIN_PRESENTERS.has(p)) return p;
      return 'その他';
    }

    // Color Identity → Set（W/U/B/R/G）。無色は size 0
    function ciSet(row) {
      const v = row[KEY_COLOR_ID];
      if (Array.isArray(v)) {
        return new Set(v.map(x => String(x).toUpperCase()).filter(c => 'WUBRG'.includes(c)));
      }
      const letters = String(v ?? '').toUpperCase().match(/[WUBRG]/g) || [];
      return new Set(letters);
    }

    // === Commander基準の色フィルタ ===
    // ルール：
    // - 未選択 → 全通し
    // - {C}のみ → 無色のみ
    // - 他色選択（例: {R,U}） → CI が選択色の「部分集合」ならOK
    //   例：選択{R,U} → OK: {}, {R}, {U}, {R,U} / NG: {R,U,G}
    function matchColorsCommander(row, checked) {
      const set = new Set(checked);
      const have = ciSet(row); // カードのCI

      if (set.size === 0) return true;               // 色未選択
      if (set.size === 1 && set.has('C')) return have.size === 0; // 無のみ

      if (set.has('C')) set.delete('C');             // Cと他色の同時チェック → C無視

      // have ⊆ set
      for (const c of have) {
        if (!set.has(c)) return false;
      }
      return true;
    }

    // === ソート：色（Identity） ===
    // 基本順 W→U→B→R→G、次に色数、最後にカード名
    const COLOR_ORDER = { 'W':1, 'U':2, 'B':3, 'R':4, 'G':5 }; // 無色は0
    function colorSortKey(row) {
      const have = ciSet(row);
      if (have.size === 0) return [0, 0, getTitle(row).toLowerCase()]; // 無色
      const seq = ['W','U','B','R','G'].filter(c => have.has(c));
      const minRank = COLOR_ORDER[seq[0]];
      return [minRank, seq.length, getTitle(row).toLowerCase()];
    }

    function toNum(v) {
      if (typeof v === 'number') return v;
      const n = Number(String(v).replace(/[^\d.-]/g,''));
      return Number.isFinite(n) ? n : Number.NEGATIVE_INFINITY;
    }

    // ===== 描画 =====
    function render(list) {
      grid.innerHTML = '';
      const frag = document.createDocumentFragment();
      let shown = 0;

      for (const row of list) {
        const url = s(row[KEY_IMG]);
        if (!url) continue;

        const title = getTitle(row);
        const wrap = document.createElement('div');
        wrap.className = 'card';

        const img = document.createElement('img');
        img.className = 'thumb';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.src = toHttps(url);
        img.alt = title;
        img.onerror = () => { wrap.remove(); };

        const cap = document.createElement('div');
        cap.className = 'cap';
        cap.textContent = title;

        const meta = document.createElement('div');
        meta.className = 'meta';
        const pres = getPresenterRaw(row);
        const colors = [...ciSet(row)].join('') || '無';
        const ep = s(row[KEY_EPISODE]);
        meta.textContent = [
          pres ? `P:${pres}` : '',
          `色:${colors}`,
          ep ? `話数:${ep}` : ''
        ].filter(Boolean).join(' / ');

        wrap.append(img, cap, meta);
        frag.appendChild(wrap);
        shown++;
      }

      grid.appendChild(frag);
      stat.textContent = `表示: ${shown} / 全${ALL.length}`;
      console.log(`render: shown=${shown}, total=${ALL.length}`);
    }

    // ===== 検索＋絞り込み＋ソート =====
    function applyFilterSort() {
      const q       = s(document.getElementById('q').value).toLowerCase();
      const presSel = s(document.getElementById('presenter').value);
      const sortKey = document.getElementById('sortKey').value;
      const sortDir = document.getElementById('sortDir').value;

      // 色チェック
      const checked = [...document.querySelectorAll('#colorBox input[type="checkbox"]:checked')].map(x => x.value);

      // フィルタ
      view = ALL.filter(row => {
        if (q) {
          const name = (s(row[KEY_JA]) + ' ' + s(row[KEY_EN])).toLowerCase();
          if (!name.includes(q)) return false;
        }
        if (presSel) {
          const bucket = getPresenterBucket(row);
          if (presSel !== bucket) return false;
        }
        if (!matchColorsCommander(row, checked)) return false;

        return true;
      });

      // ソート
      const mul = (sortDir === 'desc') ? -1 : 1;
      if (sortKey === 'color') {
        view.sort((a, b) => {
          const aa = colorSortKey(a);
          const bb = colorSortKey(b);
          for (let i = 0; i < Math.max(aa.length, bb.length); i++) {
            if (aa[i] === bb[i]) continue;
            return (aa[i] < bb[i] ? -1 : 1) * mul;
          }
          return 0;
        });
      } else if (sortKey === 'episode') {
        view.sort((a, b) => (toNum(a[KEY_EPISODE]) - toNum(b[KEY_EPISODE])) * mul);
      }

      render(view);
    }

    // ===== イベント =====
    let t;
    function onChange(){ clearTimeout(t); t = setTimeout(applyFilterSort, 120); }
    document.getElementById('q').addEventListener('input', onChange);
    document.getElementById('presenter').addEventListener('change', onChange);
    document.getElementById('sortKey').addEventListener('change', onChange);
    document.getElementById('sortDir').addEventListener('change', onChange);
    document.querySelectorAll('#colorBox input[type="checkbox"]').forEach(el => el.addEventListener('change', onChange));

    // ===== 初期ロード =====
    google.script.run
      .withSuccessHandler(text => {
        let rows = [];
        try { rows = JSON.parse(text); } catch (e) { console.error('JSON.parse失敗', e, text); }
        console.log('rows:', rows.length);
        ALL.push(...rows);
        applyFilterSort(); // 初回描画
      })
      .withFailureHandler(err => {
        console.error(err);
        grid.textContent = '取得エラー';
      })
      .fetchDatabaseJson(2000); // 件数は適宜調整
  </script>
</body>
</html>
